service: ai-swing-trade-assistant

frameworkVersion: "4"

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  memorySize: 512
  timeout: 30
  environment:
    DYNAMODB_TABLE: users
    CHAT_DYNAMODB_TABLE: conversations
  httpApi:
    cors:
      allowedOrigins:
        - "*"
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - OPTIONS
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:*
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/users
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/conversations
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/DB_ACCESS_KEY_ID
            - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/DB_SECRET_ACCESS_KEY
            - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/JWT_SECRET
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource: "*"
          Condition:
            StringEquals:
              kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

functions:
  api:
    handler: main.handler
    events:
      - httpApi:
          method: ANY
          path: /{proxy+}
      - httpApi:
          method: ANY
          path: /

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
  # Per-table creation (set false if table already exists outside this stack). See README.
  createUsersTable: ${env:CREATE_USERS_TABLE, 'true'}
  createConversationsTable: ${env:CREATE_CONVERSATIONS_TABLE, 'true'}

package:
  patterns:
    - "!venv/**"
    - "!node_modules/**"
    - "!.env"
    - "!__pycache__/**"
    - "!*.pyc"

resources:
  Parameters:
    CreateUsersTable:
      Type: String
      Default: ${self:custom.createUsersTable}
      AllowedValues:
        - "true"
        - "false"
    CreateConversationsTable:
      Type: String
      Default: ${self:custom.createConversationsTable}
      AllowedValues:
        - "true"
        - "false"

  Conditions:
    ShouldCreateUsersTable:
      Fn::Equals:
        - Ref: CreateUsersTable
        - "true"
    ShouldCreateConversationsTable:
      Fn::Equals:
        - Ref: CreateConversationsTable
        - "true"

  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Condition: ShouldCreateUsersTable
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH

    ConversationsTable:
      Type: AWS::DynamoDB::Table
      Condition: ShouldCreateConversationsTable
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: conversations
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_email
            AttributeType: S
          - AttributeName: conversation_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_email
            KeyType: HASH
          - AttributeName: conversation_id
            KeyType: RANGE

  Outputs:
    # HttpApiUrl is already emitted by Serverless (do not redefine — merges break CF validation).
    UsersTableName:
      Condition: ShouldCreateUsersTable
      Value: !Ref UsersTable
    ConversationsTableName:
      Condition: ShouldCreateConversationsTable
      Value: !Ref ConversationsTable
